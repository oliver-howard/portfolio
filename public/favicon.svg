<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor { animation: blink 1s step-start infinite; }
  </style>
  <rect width="16" height="16" fill="#0d1117"/>
  <g class="cursor">
    <rect x="5" y="3"  width="2" height="2" fill="#4fa3e0"/>
    <rect x="7" y="5"  width="2" height="2" fill="#4fa3e0"/>
    <rect x="9" y="7"  width="2" height="2" fill="#4fa3e0"/>
    <rect x="7" y="9"  width="2" height="2" fill="#4fa3e0"/>
    <rect x="5" y="11" width="2" height="2" fill="#4fa3e0"/>
  </g>
</svg>
